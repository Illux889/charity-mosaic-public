<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Udforsk CoolUnite kunstmosaikker fra Artpusher og Hornsleth.">
<title>CoolUnite kunstmosaikker</title>
<link rel="stylesheet" href="./landing.css">
<script src="./landing.js" defer></script>
</head>
<body>
<main class="page">
  <header class="intro">
    <p class="eyebrow">Kunstprojekter</p>
    <h1>CoolUnite kunstmosaikker</h1>
    <p class="lead">Vælg et kunstværk og se, hvordan bidragene tilsammen bliver til ét samlet motiv.</p>
  </header>

  <section aria-label="Kunstværker">
    <ul class="gallery">
      <li>
        <a class="art-card" href="https://www.illux.dk/coolunite/artpusher" target="_top" aria-label="Se kunstværket af Artpusher">
          <div class="art-card__media">
            <img src="./artists/artpusher/target.jpg" alt="Artpushers kunstmotiv" width="5906" height="8268" loading="eager">
          </div>
          <div class="art-card__body">
            <h2>Artpusher</h2>
            <span class="art-card__cta">Se kunstværket <span aria-hidden="true">→</span></span>
          </div>
        </a>
      </li>
      <li>
        <a class="art-card" href="https://www.illux.dk/coolunite/hornsleth" target="_top" aria-label="Se kunstværket af Hornsleth">
          <div class="art-card__media">
            <img src="./artists/hornsleth/target.jpg" alt="Hornsleths kunstmotiv" width="857" height="1200" loading="eager">
          </div>
          <div class="art-card__body">
            <h2>Hornsleth</h2>
            <span class="art-card__cta">Se kunstværket <span aria-hidden="true">→</span></span>
          </div>
        </a>
      </li>
    </ul>
  </section>

  <p class="local-note" id="localNote" hidden>Interaktive mosaikker skal testes via en lokal webserver.</p>
</main>
<script>
if (location.protocol === 'file:') document.getElementById('localNote').hidden = false;
</script>
</body>
</html>
